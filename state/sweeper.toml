draft_comment = "The documentation alternative is implemented in [#1104](https://github.com/foldkit/foldkit/pull/1104). The [Submodel guide](https://github.com/foldkit/foldkit/blob/b702a5efbb74bebc056b798b414ddb923a82fbd5/packages/website/src/page/core/submodel.md#L226) explains passing current parent state through the child update's third `context` argument, and its [source example](https://github.com/foldkit/foldkit/blob/b702a5efbb74bebc056b798b414ddb923a82fbd5/packages/website/src/snippet/submodelParentStateInUpdate.ts#L37) closes over `currentUser` when constructing `Update.foldChild`, then calls `foldSettings(model.currentUser)(model, message)` for each dispatch. It also distinguishes reading context from notifying a child through an `inform*` helper. This satisfies the documented-closure alternative in the issue, so it can be closed."

