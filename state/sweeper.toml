draft_comment = "A narrower version landed in [#1394](https://github.com/foldkit/foldkit/pull/1394), with keyed-fold recognition added in [#1608](https://github.com/foldkit/foldkit/pull/1608). [`foldkit/require-fold-for-child-update-result`](https://github.com/foldkit/foldkit/blob/b702a5efbb74bebc056b798b414ddb923a82fbd5/packages/oxlint-plugin-foldkit/src/rules/require-fold-for-child-update-result.ts#L475) flags a namespaced child update/helper result whose Model is manually copied into the matching parent field when that file establishes the field through a child fold. It recommends `Update.foldChild`, `Update.foldChildAt`, or `Update.foldChildStep`. Direct imports, aliases, and files without matching fold wiring are outside its coverage, so this is partial enforcement rather than a general check of hand-written `Got*` handlers."

