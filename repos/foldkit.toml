# Registry entry. Format: designs/cafe-maintainer.md, "Registry".
name = "foldkit"
upstream = "foldkit/foldkit"
# Legacy: remote `origin` is tao-io/foldkit. Use it only for pull requests
# whose head is already there; open new ones from the fork. See AGENTS.md.
fork = "artile/foldkit"
path = "/home/om/TAO/Tools/foldkit"
mode = "maintain"
merge_method = "squash"                # squash | merge | rebase; how upstream merges pull requests
default_branch = "main"
# foldkit, @foldkit/ui and @foldkit/devtools are one fixed changeset group,
# so the foldkit@<version> tag covers all three. v* tags are canaries.
release_tags = "foldkit@*"
packages = ["foldkit", "@foldkit/ui", "@foldkit/devtools"]
rules = ["AGENTS.md", "CONTRIBUTING.md", ".agents/writing-prose.md"]
owner_plan_authors = ["devinjameson"]
clone = "full"
